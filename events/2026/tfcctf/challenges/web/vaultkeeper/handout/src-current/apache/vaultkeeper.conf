# Appliance HTTP front-end. Version/identity banners are suppressed so the
# build fingerprint is not advertised to clients.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        AcceptPathInfo Off
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    <FilesMatch "^(fetch_source|peer_probe|webhook_test)\.php$">
        Require ip 127.0.0.1
    </FilesMatch>
    <FilesMatch "^(keyring|vault_unseal)\.php$">
        Require ip 127.0.0.1
    </FilesMatch>

    # Strip framework/identity response headers on every reply.
    <IfModule mod_headers.c>
        Header always unset X-Powered-By
        Header unset X-Powered-By
        Header always unset Server
        Header unset Server
    </IfModule>

    AllowEncodedSlashes Off
    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
